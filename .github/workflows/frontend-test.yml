name: Frontend Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/frontend-test.yml'
      - 'plugins.v2/subscribeassistantenhanced/frontend/**'
      - 'plugins.v3/subscribeassistantenhanced/frontend/**'
      - 'tests/v3/subscribeassistantenhanced/frontend/**'

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins.v3/subscribeassistantenhanced/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: plugins.v3/subscribeassistantenhanced/frontend/yarn.lock

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins.v3/subscribeassistantenhanced/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: plugins.v3/subscribeassistantenhanced/frontend/yarn.lock

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Lint
        run: yarn lint

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: plugins.v3/subscribeassistantenhanced/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: plugins.v3/subscribeassistantenhanced/frontend/yarn.lock

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests with coverage
        run: yarn test:coverage

  distributable:
    name: Distributable (${{ matrix.generation }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        generation: [v2, v3]
    defaults:
      run:
        working-directory: plugins.${{ matrix.generation }}/subscribeassistantenhanced/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: plugins.${{ matrix.generation }}/subscribeassistantenhanced/frontend/yarn.lock

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build distributable
        run: yarn build

      - name: Verify distributable
        run: |
          test -s dist/assets/remoteEntry.js
          if [ -n "$(git status --porcelain --untracked-files=all -- dist)" ]; then
            git status --short --untracked-files=all -- dist
            exit 1
          fi
