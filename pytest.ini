[pytest]
# 仅在仓库根 tests/ 下发现用例；插件源码目录不承载测试
testpaths = tests
python_files = test_*.py
addopts = --import-mode=importlib
# 测试统一使用 pytest 风格；所有插件都按插件 ID 建独立子目录
python_classes = *Test Test*
python_functions = test_*
# v2/v3 必须分会话运行（同名插件包冲突）；两者均在 V3 后端运行
markers =
    v2: 兼容 V3 的 v2 插件（plugins.v2/）单测
    v3: V3 专用插件（plugins.v3/）单测
# 仅忽略主程序依赖链或三方库在 Python 3.12 下的已知弃用告警；插件仓自身告警应直接修复
filterwarnings =
    ignore:datetime.datetime.utcfromtimestamp\(\) is deprecated:DeprecationWarning
    ignore:'crypt' is deprecated:DeprecationWarning
    ignore:'audioop' is deprecated:DeprecationWarning
    ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:starlette.exceptions.StarletteDeprecationWarning
